<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>효제문자도 여덟 폭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* VOICE: 조용하고 단정한 전시 도록. 먹과 한지, 여덟 덕목의 오방색만 크게.
   IDEA: 접혀 선 8폭 병풍을 펼쳐 한 폭씩 걸어 들어가는 전시장.
   PICTURE: 메인은 원근감 있게 접힌 병풍, 孝 섹션은 수묵 배경 위에 도상이 차례로 떠오르는 무대.
   COLOUR and TYPE: 한지 #efe8da, 먹 #1d1b18, 덕목마다 한 가지 색. Noto Serif KR + Noto Sans KR.
   LAYOUT: 100vh 풀페이지 9개, 孝는 한 화면 안에서 버튼으로 이야기 재생. */
:root{color-scheme:light;--c-hyo:#bf8078;--paper:#faf7f0;--paper2:#efe9dc;--ink:#1d1b18;--ink2:#4b463e;--ink3:#7a7266;--wood:#3a2a1d;--gold:#b08a4a;
  --serif:"Noto Serif KR","Nanum Myeongjo",Batang,serif;--sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--navh:68px}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-snap-type:y proximity}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
html{background:var(--paper)}
.sec{min-height:100vh;min-height:100svh;scroll-snap-align:start;position:relative}

/* ---------- 상단 네비 ---------- */
.nav{position:fixed;inset:0 0 auto;z-index:50;height:var(--navh);display:flex;align-items:center;gap:16px;padding:0 max(3vw,12px);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid #0001;
  opacity:0;transform:translateY(-100%);pointer-events:none;transition:opacity .6s ease,transform .6s ease}
.nav.show{opacity:1;transform:none;pointer-events:auto}
.brand{font-family:var(--serif);font-weight:900;font-size:17px;text-decoration:none;white-space:nowrap}
.nav ul{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:2px}
.nav a.it{position:relative;display:grid;justify-items:center;gap:1px;min-width:48px;padding:6px 8px;border-radius:10px;text-decoration:none;color:var(--ink2);transition:background .2s,color .2s}
.it b{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1}
.it small{font-size:11px;line-height:1.2;white-space:nowrap}
.it:hover{background:#0000000d;color:var(--ink)}
.nav a.it[aria-current=true]{background:var(--c);color:var(--tc,#fff);text-shadow:0 1px 2px #0002;box-shadow:inset 0 0 0 1px #0000000f}
.nav a.it[aria-current=true] b,.nav a.it[aria-current=true] small{color:var(--tc,#fff)}
.it .tip{position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-4px);width:max-content;max-width:220px;padding:10px 12px;border-radius:10px;
  background:var(--ink);color:var(--paper);font-size:13px;line-height:1.45;text-align:left;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 24px #0003}
.it .tip::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.it .tip em{display:block;font-style:normal;font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:2px}
.it:hover .tip,.it:focus-visible .tip{opacity:1;transform:translate(-50%,0)}
.nav li:first-child .tip{left:0;transform:translate(0,-4px)}.nav li:first-child .tip::before{left:24px}
.nav li:first-child .it:hover .tip{transform:none}
.nav li:last-child .tip{left:auto;right:0;transform:translate(0,-4px)}.nav li:last-child .tip::before{left:auto;right:18px}
.nav li:last-child .it:hover .tip{transform:none}

/* ---------- 1. 메인: 8폭 병풍 ---------- */
.main{display:grid;align-content:center;gap:clamp(24px,4vh,44px);padding:clamp(28px,6vh,64px) max(4vw,16px);
  background:transparent}
.main-head{text-align:center;display:grid;gap:10px;justify-items:center}
.main-head .han{font-family:var(--serif);font-size:15px;letter-spacing:.3em;color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.main-head h1{font-size:clamp(36px,6vw,58px);font-weight:900}
.main-head p{color:var(--ink2);max-width:46ch}
.screen{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));--sw:min(1500px,calc(100vw - 80px),calc((100vh - 230px) * 2.9));width:var(--sw);margin:0 0 0 calc((100% - var(--sw)) / 2);perspective:2600px;transform-style:preserve-3d;
  filter:drop-shadow(0 28px 24px #3a2a1d33)}
.panel{display:block;position:relative;text-decoration:none;background:var(--wood);padding:10px 6px 74px;
  --ry:30deg;width:115.47%;margin-left:-7.735%;transform:rotateY(var(--ry));transform-origin:center;transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .45s ease;cursor:zoom-in}
.panel:nth-child(even){--ry:-30deg}
.panel::before{content:"";position:absolute;inset:4px;border:1px solid #b08a4a66;pointer-events:none}
.panel .silk{display:block;aspect-ratio:424/1004;background:#efe3c8;overflow:hidden;box-shadow:inset 0 0 0 3px #6b4e2e}
.panel img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.panel .lbl{position:absolute;left:0;right:0;bottom:28px;text-align:center;color:#f1e4c8;font-size:14px;line-height:1.2}
.panel .lbl b{font-family:var(--serif);font-size:20px;margin-right:4px}
/* 마우스를 올리면 그 폭이 스르륵 앞으로 나오며 커진다 */
.panel:hover,.panel:focus-visible{transform:rotateY(calc(var(--ry) * .35)) translateZ(70px) translateY(-6px) scale(1.04);z-index:3;filter:brightness(1.06)}
.panel:hover img{transform:scale(1.04)}
.panel:first-child:hover{transform-origin:left center}.panel:last-child:hover{transform-origin:right center}
.panel.sel{transform:rotateY(0) translateZ(120px) scale(1.12);z-index:4;filter:brightness(1.05);cursor:pointer}
/* 양 끝 폭(孝·恥)은 바깥 모서리를 축으로 돌려 화면 밖으로 잘리지 않게 */
.panel:first-child.sel{transform-origin:left center;transform:rotateY(0) translateX(24px) translateZ(120px) scale(1.12)}
.panel:last-child.sel{transform-origin:right center;transform:rotateY(0) translateX(-24px) translateZ(120px) scale(1.12)}
.panel.sel::after{content:"한 번 더 누르면 이야기로";position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%) scale(.78);white-space:nowrap;font:500 13px var(--sans);color:var(--ink2)}
.screen.has-sel .panel:not(.sel){filter:brightness(.85) saturate(.8)}
.screen:has(.panel:hover) .panel:not(:hover):not(.sel){filter:brightness(.85) saturate(.8)}
.main-hint{text-align:center;font-size:13px;color:var(--ink3)}
.scroll-cue{justify-self:center;width:26px;height:40px;border:1.5px solid var(--ink3);border-radius:14px;position:relative}
.scroll-cue::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--ink3);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* ---------- 2. 孝 스크롤리텔링 ---------- */
.hyo{background:transparent;scroll-snap-align:start}
/* 넓은 화면에서도 글과 그림이 1320px 폭 안에 모이도록 좌우 여백(--gx)을 늘린다 */
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;--gx:max(3vw,12px,calc((100vw - 1320px) / 2))}
.ink{display:none}
.ink svg{width:100%;height:100%;display:block}
.scene{opacity:0;transition:opacity 1.4s ease}
.hyo[data-step="0"] .s0,.hyo[data-step="1"] .s1,.hyo[data-step="2"] .s2,.hyo[data-step="3"] .s3,.hyo[data-step="4"] .s4{opacity:1}
.ink::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 70% 50%,transparent 45%,color-mix(in srgb,var(--paper) 35%,transparent) 100%)}
.fg{position:absolute;inset:var(--navh) 0 0;display:grid;place-items:center end;padding-right:max(9vw,20px,calc(var(--gx) + 40px))}
/* 孝 한 폭을 작게 세워 두고, 단계마다 글자는 연해지고 도상이 제자리에서 떠오른다 */
.frame{position:relative;height:min(calc(100vh - var(--navh) - 64px),780px);aspect-ratio:424/1004;box-shadow:0 18px 40px #0000001a}
.frame .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;filter:saturate(.9);transition:opacity calc(.6s * var(--k,1)) ease,filter calc(.6s * var(--k,1)) ease}
.frame .mt{position:absolute;height:auto;opacity:0;transform:scale(.96);transition:opacity calc(.6s * var(--k,1)) ease,transform calc(.7s * var(--k,1)) cubic-bezier(.2,.7,.2,1),filter calc(.6s * var(--k,1));filter:drop-shadow(0 6px 10px #0002)}
.hyo:not([data-step="0"]):not([data-step="4"]) .frame .base{opacity:.16;filter:grayscale(.6)}
.hyo[data-step="4"] .frame .base{opacity:1}
.hyo[data-step="1"] .mt1,.hyo[data-step="2"] .mt2,.hyo[data-step="3"] .mt3{opacity:1;transform:none}
.hyo[data-step="2"] .mt1,.hyo[data-step="3"] .mt1,.hyo[data-step="3"] .mt2{opacity:.35;filter:grayscale(.5)}
/* 孝 표지: 같은 화면에서 색바탕이 걷히며 수묵 이야기로 바뀐다 */
.cover{position:absolute;inset:0;z-index:5;display:grid;place-items:center;align-content:center;gap:14px;padding:var(--navh) 16px 40px;text-align:center;color:#fff;background:var(--c-hyo);
  transition:opacity .6s ease,visibility 0s 0s}
.cover .g{font-family:var(--serif);font-weight:900;font-size:clamp(140px,26vw,300px);line-height:1;text-shadow:0 8px 30px #0002}
.cover h2{font-size:clamp(24px,3.4vw,34px);font-weight:600}
.cover p{opacity:.9}
.go{margin-top:10px;min-height:46px;padding:0 26px;border-radius:999px;border:1.5px solid #fffc;background:#ffffff26;color:#fff;font:400 16px var(--sans);cursor:pointer;transition:background .3s}
.go:hover{background:#ffffff47}
.hyo:not([data-step=intro]) .cover{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s ease,visibility 0s .6s}
.cover .g,.cover h2,.cover p,.cover .go{transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .6s}
.hyo:not([data-step=intro]) .cover .g,.hyo:not([data-step=intro]) .cover h2,.hyo:not([data-step=intro]) .cover p,.hyo:not([data-step=intro]) .cover .go{transform:translateY(18px);opacity:0}
.hyo[data-step=intro] .dots,.hyo[data-step=intro] .cards{opacity:0}
.dots,.cards{transition:opacity .5s}
.dots{position:absolute;left:var(--gx);top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:3}
.dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink2);background:transparent;padding:0;cursor:pointer;transition:.3s}
.dots button[aria-current=true]{background:#8f2f2a;border-color:#8f2f2a;transform:scale(1.25)}
.ctl{position:absolute;left:calc(var(--gx) + 40px);bottom:clamp(64px,11vh,110px);display:flex;gap:8px;z-index:3;transition:opacity 1s}
.hyo[data-step=intro] .ctl{opacity:0;pointer-events:none}
.ctl button{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:color-mix(in srgb,var(--paper) 85%,transparent);color:var(--ink);font:600 14px var(--sans);cursor:pointer}
.ctl button:hover{background:var(--ink);color:var(--paper)}
.cards{position:absolute;left:calc(var(--gx) + 40px);top:50%;transform:translateY(-50%);width:min(480px,44vw);display:grid;z-index:3}
.card{grid-area:1/1;align-self:center;background:transparent;padding:28px 28px 26px;
  opacity:0;visibility:hidden;transition:opacity calc(.4s * var(--k,1)) ease,visibility 0s calc(.4s * var(--k,1))}
.card.on{opacity:1;visibility:visible;transition:opacity calc(.5s * var(--k,1)) ease calc(.1s * var(--k,1)),visibility 0s}
.card .tag{font-size:13px;color:#8f2f2a;font-weight:700}
.card h2{font-size:clamp(28px,4vw,40px);font-weight:900;margin:6px 0 10px}
.card h3{font-size:17px;font-weight:600;color:var(--ink2);margin-bottom:28px}
.card p{color:var(--ink2)}
.card .src{display:block;margin-top:12px;font-size:13px;color:var(--ink3)}
.play{margin-top:18px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:600 15px var(--sans);cursor:pointer}
.play[aria-pressed=true]{background:transparent;color:var(--ink)}

/* ---------- 3~9. 컬러 블록 ---------- */
.block{display:grid;place-items:center;align-content:center;gap:14px;color:var(--tc,#fff);text-align:center;padding:var(--navh) 16px 40px;background:var(--c)}
.block .g{font-family:var(--serif);font-weight:900;font-size:clamp(140px,26vw,300px);line-height:1;opacity:.95;text-shadow:0 8px 30px #0002}
.block h2{font-size:clamp(24px,3.4vw,34px);font-weight:600}
.block p{opacity:.85}
.block .wip{font-size:13px;padding:5px 14px;border:1px solid currentColor;border-radius:999px;opacity:.8}

/* ---------- 탑 버튼 ---------- */
.top{position:fixed;right:max(2.5vw,14px);bottom:max(2.5vw,14px);z-index:60;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--ink);color:var(--paper);display:grid;place-items:center;gap:0;box-shadow:0 8px 22px #0004;
  opacity:0;transform:translateY(16px);pointer-events:none;transition:.4s}
.top.show{opacity:1;transform:none;pointer-events:auto}
.top:hover{background:#8f2f2a}
.top span{font:700 11px/1 var(--sans)}
.top svg{width:18px;height:18px;margin-bottom:-6px}

@media (max-width:900px){
  .brand{display:none}.nav ul{margin:0 auto}
  .it small{display:none}.nav a.it{min-width:38px;padding:8px 6px}
  .screen{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:14px;max-width:560px}
  .panel:nth-child(n){--ry:0deg;width:auto;margin-left:0}
  .panel.sel{transform:scale(1.12)}
}
@media (max-width:700px){
  .fg{place-items:start center;padding:calc(var(--navh) + 12px) 0 0}
  .frame{height:46vh}
  .cards{left:16px;right:16px;width:auto;top:auto;bottom:20px;transform:none}
  .card{padding:18px 20px}
  .dots{left:auto;right:10px;top:auto;bottom:50%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<nav class="nav" id="nav" aria-label="여덟 덕목">
  <a class="brand" href="#main">효제문자도</a>
  <ul id="navList"></ul>
</nav>

<!-- 1. 메인 -->
<section class="sec main" id="main">
  <h1 class="sr">효제문자도</h1>
  <nav class="screen" id="screen" aria-label="여덟 폭 병풍"></nav>
  <a class="scroll-cue" href="#hyo" aria-label="아래로"></a>
</section>

<!-- 2. 孝 -->
<section class="sec hyo" id="hyo" data-step="intro">
  <div class="stage">
    <div class="ink" aria-hidden="true">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax meet">
        <defs>
          <filter id="bleed" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4"/>
            <feDisplacementMap in="SourceGraphic" scale="22"/>
            <feGaussianBlur stdDeviation="1.6"/>
          </filter>
          <filter id="mist"><feGaussianBlur stdDeviation="18"/></filter>
          <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="4" seed="11"/>
            <feDisplacementMap in="SourceGraphic" scale="14"/>
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
          <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
          <linearGradient id="peakG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6152" stop-opacity=".15"/><stop offset=".45" stop-color="#6b6152" stop-opacity=".07"/><stop offset=".8" stop-color="#6b6152" stop-opacity="0"/></linearGradient>
          <linearGradient id="ridgeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6152" stop-opacity=".15"/><stop offset="1" stop-color="#6b6152" stop-opacity="0"/></linearGradient>
          <linearGradient id="farG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6152" stop-opacity=".06"/><stop offset="1" stop-color="#6b6152" stop-opacity="0"/></linearGradient>
          <!-- 안개 속 높은 봉우리 하나, 아래로 낮은 능선과 소나무 몇 무더기 -->
          <g id="hills" transform="translate(1600 0) scale(-1 1) translate(-420 -330) scale(1.45)">
            <path filter="url(#wash)" fill="url(#farG)" d="M420 690 C520 660 600 640 680 620 C740 608 800 606 860 612 C900 604 930 610 960 622 C880 660 680 690 420 690Z"/>
            <path filter="url(#wash)" fill="url(#farG)" d="M1700 640 C1760 622 1810 614 1860 616 C1890 620 1910 628 1920 634 Z"/>
            <path filter="url(#wash)" fill="url(#ridgeG)" d="M860 680 C980 660 1100 640 1180 610 C1240 590 1300 574 1340 578 C1380 584 1440 616 1500 640 C1540 618 1590 596 1620 598 C1650 600 1670 622 1700 640 C1760 660 1830 676 1900 690 C1600 720 1200 730 860 680Z"/>
            <g fill="#6b6152" opacity=".1" filter="url(#wash)" id="pines"></g>
          </g>
        </defs>
        <g fill="#3a3632">
          <!-- 장면마다 산과 안개만 바꾸고, 사물은 아주 옅은 붓자국으로만 암시한다 -->
          <g class="scene s0"><use href="#hills"/></g>
          <g class="scene s1"><use href="#hills"/>
            <path d="M0 720 C420 690 1180 690 1600 720 V900 H0Z" fill="#8f9a9c" opacity=".10" filter="url(#mist)"/>
            <path d="M260 752 C620 740 980 742 1340 756" stroke="#2a2622" stroke-width="2" fill="none" opacity=".10" filter="url(#bleed)"/>
          </g>
          <g class="scene s2"><use href="#hills"/><g id="bamboo" style="display:none"></g></g>
          <g class="scene s3"><use href="#hills"/></g>
          <g class="scene s4"><use href="#hills"/></g>
        </g>
      </svg>
    </div>
    <div class="fg" aria-hidden="true">
      <div class="frame">
        <img class="base" src="img/hyo.webp" alt="">
        <img class="mt mt1" src="img/hyo_carp.png" alt="" style="left:7.9%;top:5.18%;width:92.1%">
        <img class="mt mt2" src="img/hyo_shoot.png" alt="" style="left:7.08%;top:10.76%;width:41.39%">
        <img class="mt mt3" src="img/hyo_fan.png" alt="" style="left:54.25%;top:32.42%;width:39.62%">
      </div>
    </div>
    <div class="cover" id="cover">
      <span class="g">孝</span><h2>효도 효</h2><p>부모를 섬기는 마음</p>
      <button class="go" id="goBtn" type="button">문자도에 담긴 이야기 보기</button>
    </div>
    <div class="dots" id="dots" aria-label="이야기 단계"></div>
    <div class="ctl"><button type="button" id="playBtn" aria-pressed="true">■ 멈춤</button><button type="button" id="speedBtn" title="재생 속도 바꾸기">속도 1×</button><button type="button" id="homeBtn">처음으로</button></div>
    <div class="cards" id="cards" aria-live="polite"></div>
  </div>
</section>

<div id="blocks"></div>

<button class="top" id="topBtn" type="button" aria-label="맨 위 병풍으로">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg><span>TOP</span>
</button>

<script>
{
const V = [
  { id:'hyo',  h:'孝', k:'효', hun:'효도 효',     mean:'부모를 섬기는 마음', c:'#bf8078', tc:'#fff', f:'hyo' },
  { id:'je',   h:'悌', k:'제', hun:'공경할 제',   mean:'형제끼리 아끼고 윗사람을 공경함', c:'#86a77c', tc:'#fff', f:'je' },
  { id:'chung',h:'忠', k:'충', hun:'충성 충',     mean:'나라와 공동체에 정성을 다함', c:'#9a7aa0', tc:'#fff', f:'chung' },
  { id:'sin',  h:'信', k:'신', hun:'믿을 신',     mean:'사람 사이의 믿음과 약속', c:'#c4a257', tc:'#fff', f:'sin' },
  { id:'ye',   h:'禮', k:'예', hun:'예도 례',     mean:'절제하고 예의를 지킴', c:'#c0645a', tc:'#fff', f:'ye' },
  { id:'ui',   h:'義', k:'의', hun:'옳을 의',     mean:'옳은 도리와 의리를 지킴', c:'#ebe5d8', tc:'#3a342c', f:'ui' },
  { id:'yeom', h:'廉', k:'염', hun:'청렴할 렴',   mean:'욕심 내지 않고 깨끗함', c:'#6fa0a6', tc:'#fff', f:'yeom' },
  { id:'chi',  h:'恥', k:'치', hun:'부끄러울 치', mean:'부끄러움을 알고 스스로 돌아봄', c:'#5e5a57', tc:'#fff', f:'chi' },
];

const STEPS = [
  { tag:'孝 · 효도 효', t:'부모를 섬기는 글자', s:'효제문자도의 첫 폭', p:'조선 후기 문자도에서 孝 자의 老 부분은 잉어와 죽순이 대신한다. 그림 하나하나가 옛 효자 이야기의 한 장면이다. 이야기가 차례로 펼쳐진다.', src:'', play:true },
  { tag:'첫째 이야기 · 잉어', t:'왕상빙리', s:'王祥氷鯉 · 얼음 위의 잉어', p:'진나라 왕상은 한겨울 계모가 산 물고기를 찾자 얼어붙은 강 위에 옷을 벗고 누워 얼음을 녹이려 했다. 그러자 얼음이 갈라지며 잉어 두 마리가 뛰어올랐다.', src:'출전 · 『진서』 왕상전' },
  { tag:'둘째 이야기 · 죽순', t:'맹종읍죽', s:'孟宗泣竹 · 대숲의 눈물', p:'오나라 맹종은 병든 어머니가 한겨울에 죽순국을 찾자 눈 덮인 대숲에 들어가 울었다. 그 눈물이 떨어진 자리에서 땅을 뚫고 죽순이 돋았다.', src:'출전 · 이십사효' },
  { tag:'셋째 이야기 · 부채', t:'황향선침', s:'黃香扇枕 · 베개를 식힌 부채', p:'후한의 아홉 살 황향은 여름이면 아버지의 베개에 부채질을 해 식히고, 겨울이면 먼저 이불 속에 들어가 몸으로 데웠다.', src:'출전 · 이십사효' },
  { tag:'', t:'', s:'', p:'孝는 늙을 로(老)의 윗부분과 아들 자(子)를 합친 글자로, 자식이 늙은 부모를 아래에서 떠받드는 모습을 담았다. 『설문해자』는 이를 “자식이 늙은이를 받든다(子承老也)”고 풀이한다. 문자도에서는 그 老 자리를 잉어, 죽순, 부채, 거문고(대순탄금)가 채워, 옛 효자 이야기들이 모여 한 글자 孝를 이룬다.', src:'' },
];

const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const go = id => document.getElementById(id).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });

/* 병풍 */
$('#screen').innerHTML = V.map(v => `<a class="panel" href="#${v.id}" aria-label="${v.h} ${v.hun}, ${v.mean}">
  <span class="silk"><img src="img/${v.f}.webp" alt="${v.h} 문자도"></span>
  <span class="lbl"><b>${v.h}</b>${v.k}</span></a>`).join('');

/* 네비 */
$('#navList').innerHTML = V.map(v => `<li><a class="it" href="#${v.id}" style="--c:${v.c};--tc:${v.tc}" data-id="${v.id}">
  <b>${v.h}</b><small>${v.hun}</small>
  <span class="tip" role="tooltip"><em>${v.h} · ${v.hun}</em>${v.mean}</span></a></li>`).join('');

/* 3~9 컬러 블록 */
$('#blocks').outerHTML = V.slice(1).map(v => `<section class="sec block" id="${v.id}" style="--c:${v.c};--tc:${v.tc}">
  <span class="g">${v.h}</span><h2>${v.hun}</h2><p>${v.mean}</p><span class="wip">스크롤리텔링 준비 중</span></section>`).join('');

/* 병풍: 처음 누르면 그 폭이 정면으로 커지고, 한 번 더 누르면 그 글자로 이동 */
const screenEl = $('#screen');
const clearSel = () => { screenEl.classList.remove('has-sel'); screenEl.querySelectorAll('.panel.sel').forEach(p => p.classList.remove('sel')); };
document.addEventListener('click', e => {
  const p = e.target.closest('.panel');
  if (!p) { clearSel(); return; }
  if (p.classList.contains('sel')) { clearSel(); return; }   // 아래 앵커 처리로 이동
  e.preventDefault(); e.stopImmediatePropagation();
  clearSel(); p.classList.add('sel'); screenEl.classList.add('has-sel');
}, true);
addEventListener('keydown', e => { if (e.key === 'Escape') clearSel(); });

/* 앵커 스무스 스크롤 */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (!document.getElementById(id)) return;
  e.preventDefault(); stopPlay(); go(id);
  try { history.replaceState(null, '', '#' + id); } catch (_) {}
});

/* 孝 단계 */
const hyo = $('#hyo');
$('#cards').innerHTML = STEPS.map((s, i) => `<article class="card" data-i="${i}">
  ${s.tag ? `<span class="tag">${s.tag}</span>` : ''}${s.t ? `<h2>${s.t}</h2>` : ''}${s.s ? `<h3>${s.s}</h3>` : ''}<p>${s.p}${s.src ? `<span class="src">${s.src}</span>` : ''}</p></article>`).join('');
const cardEls = [...document.querySelectorAll('#cards .card')];
$('#dots').innerHTML = STEPS.map((s, i) => `<button type="button" data-i="${i}" aria-label="${s.t || s.tag || '다시 孝 글자'}"></button>`).join('');
const dotEls = [...document.querySelectorAll('#dots button')];
/* 이야기는 스크롤로 넘어가지 않고, 「문자도에 담긴 이야기 보기」를 눌렀을 때만 이 화면 안에서 차례로 바뀐다 */
let curStep = 'intro';
const setStep = i => {
  curStep = i;
  hyo.dataset.step = i;
  cardEls.forEach((el, j) => el.classList.toggle('on', j === i));
  dotEls.forEach((d, j) => d.setAttribute('aria-current', String(j === i)));
};
const showCover = () => { stopPlay(); curStep = 'intro'; hyo.dataset.step = 'intro'; cardEls.forEach(el => el.classList.remove('on')); dotEls.forEach(d => d.setAttribute('aria-current', 'false')); };
hyo.dataset.step = 'intro';
/* 능선 위 소나무 무더기 */
const pine = [];
[[980,664,9],[1060,640,7],[1150,612,10],[1210,592,6],[1400,602,8],[1460,622,6]].forEach(([x,y,n]) => {
  for (let k = 0; k < n; k++) { const dx = (k % 4) * 16 - 24 + (k * 7 % 5), dy = -Math.floor(k / 4) * 9 - (k % 2) * 3; pine.push(`<ellipse cx="${x + dx}" cy="${y + dy}" rx="${12 + (k % 3) * 3}" ry="3.5"/>`); }
  pine.push(`<rect x="${x - 1}" y="${y - 6}" width="2" height="18"/>`);
});
$('#pines').innerHTML = pine.join('');
/* 대숲: 화면 양끝에 몇 줄기만, 옅게 */
const bam = [];
[[90,9,180],[170,6,260],[1390,8,150],[1480,6,230],[1540,5,300]].forEach(([x,w,top]) => {
  bam.push(`<rect x="${x}" y="${top}" width="${w}" height="${900 - top}"/>`);
  for (let y = top + 120; y < 880; y += 130) bam.push(`<rect x="${x - 2}" y="${y}" width="${w + 4}" height="2" fill="#f8f4ea"/>`);
  for (let k = 0; k < 2; k++) { const yy = top + 60 + k * 150, d = x < 800 ? 1 : -1; bam.push(`<ellipse cx="${x + d * 34}" cy="${yy}" rx="34" ry="4" transform="rotate(${d * (18 + k * 10)} ${x} ${yy})"/>`); }
});
$('#bamboo').innerHTML = bam.join('');

/* 버튼으로 시작하는 고사 재생: 8초마다 다음 장면 */
let timer = null, playing = false;
const playBtn = $('#playBtn');
const setPlayUI = () => { playBtn.setAttribute('aria-pressed', String(playing)); playBtn.textContent = playing ? '■ 멈춤' : (curStep === STEPS.length - 1 ? '↺ 다시 보기' : '▶ 이어 보기'); };
function stopPlay() { playing = false; clearTimeout(timer); setPlayUI(); }
/* 재생 속도: 누를 때마다 1× → 2× → 3× → 4× → 5× → 0.5×. 장면 간격과 전환 효과가 함께 빨라진다 */
const BASE = 5000, SPEEDS = [1, 2, 3, 4, 5, 0.5];
let sp = 0, stepAt = 0;
const speedBtn = $('#speedBtn');
const gap = () => BASE / SPEEDS[sp];
speedBtn.addEventListener('click', () => {
  sp = (sp + 1) % SPEEDS.length;
  speedBtn.textContent = `속도 ${SPEEDS[sp]}×`;
  hyo.style.setProperty('--k', 1 / SPEEDS[sp]);
  if (playing && curStep !== 'intro' && curStep < STEPS.length - 1) {   // 이미 지난 시간을 빼고 남은 만큼만 기다린다
    clearTimeout(timer); timer = setTimeout(() => playFrom(curStep + 1), Math.max(300, gap() - (Date.now() - stepAt)));
  }
});
function playFrom(i) {
  clearTimeout(timer); playing = true; setStep(i); setPlayUI(); stepAt = Date.now();
  if (i < STEPS.length - 1) timer = setTimeout(() => playFrom(i + 1), gap());
  else { playing = false; setPlayUI(); }
}
playBtn.addEventListener('click', () => {
  if (playing) return stopPlay();
  playFrom(curStep === 'intro' || curStep === STEPS.length - 1 ? 0 : curStep + 1);
});
$('#goBtn').addEventListener('click', () => playFrom(0));
$('#homeBtn').addEventListener('click', showCover);
dotEls.forEach(d => d.addEventListener('click', () => { stopPlay(); setStep(+d.dataset.i); setPlayUI(); }));
/* 孝 화면을 벗어나면 이야기를 멈추고 표지로 되돌린다 */
const checkLeave = () => {
  if (curStep === 'intro') return;
  const r = hyo.getBoundingClientRect(), vh = innerHeight;
  if (r.top > vh * 0.6 || r.bottom < vh * 0.4) showCover();
};
addEventListener('scroll', checkLeave, { passive: true });

/* 네비 페이드인 · 현재 위치 · 탑 버튼 */
const nav = $('#nav'), topBtn = $('#topBtn');
const ids = V.map(v => v.id);
const onScroll = () => {
  const past = hyo.getBoundingClientRect().top <= 2;
  nav.classList.toggle('show', past);
  topBtn.classList.toggle('show', scrollY > innerHeight * .6);
  let cur = null;
  for (const id of ids) if (document.getElementById(id).getBoundingClientRect().top <= innerHeight * .5) cur = id;
  document.querySelectorAll('.nav a.it').forEach(a => a.setAttribute('aria-current', String(past && a.dataset.id === cur)));
};
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onScroll);
onScroll();
topBtn.addEventListener('click', () => { stopPlay(); go('main'); try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {} });

/* 주소의 #로 들어오면 그 섹션으로 */
const fromHash = () => { const id = location.hash.slice(1); if (id && document.getElementById(id)) document.getElementById(id).scrollIntoView(); };
addEventListener('hashchange', fromHash);
fromHash();
}
</script>
</body>
</html>
